<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Generation Prompt - Genie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dynamic-textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      min-height: 150px;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-textarea:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 500px;
      overflow-y: auto;
    }

    /* Custom Scrollbar */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
      text-transform: uppercase;
    }

    .copy-btn {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .copy-btn.copied {
      background: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Image Generation Prompt</h1>
      <p class="subtitle">Visual Asset Creation Engine</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Data Input</span>
          <button class="clear-btn" onclick="clearAll()">Clear Input</button>
        </div>
        
        <div class="field-block">
          <label>[Insert Blog Post Here]</label>
          <textarea id="in_blog" class="dynamic-textarea" placeholder="Paste the full content of your blog post here..." oninput="updatePrompt()"></textarea>
        </div>
      </div>

      <!-- Result Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Generated Master Prompt</span>
        </div>
        <div class="prompt-content" id="p_result"></div>
        <button class="btn copy-btn" id="copyBtn" onclick="copyText()">
          <span>Copy Full Prompt</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const pTemplate = `আপনি একজন professional editorial visual designer এবং AI image-generation expert হিসেবে কাজ করুন।

নিচের Blog Post-টিকে visual reference হিসেবে সম্পূর্ণভাবে বিশ্লেষণ করে Blog Post-এর মূল বিষয়, গল্প, চরিত্র, আবেগ, context এবং central message-এর সঙ্গে সামঞ্জস্যপূর্ণ একটি professional 16:9 landscape feature image তৈরি করুন।

VISUAL DIRECTION

Blog Post-এর content-এর ভিত্তিতে এমন একটি compelling visual তৈরি করুন, যা প্রথম দেখাতেই পাঠককে Blog Post-এর বিষয় ও গল্প সম্পর্কে ধারণা দেয় এবং পড়ার আগ্রহ তৈরি করে।

RULES — MANDATORY

1. Story-Based Visual

   * Blog Post-এ যদি কোনও গল্প, ঘটনা, চরিত্র বা narrative থাকে, তাহলে background visual হিসেবে সেই গল্পের চরিত্রদের অথবা গল্পের কোনও গুরুত্বপূর্ণ ঘটনার একটি visually powerful, representative moment ব্যবহার করুন।
   * এমন একটি scene নির্বাচন করুন যা Blog Post-এর মূল emotion বা central idea সবচেয়ে ভালোভাবে প্রকাশ করে।
   * শুধু decorative বা generic stock-style image ব্যবহার করবেন না।

2. Visual Quality

   * Image অবশ্যই bright, glossy, polished এবং visually attractive হবে।
   * Social media-এর জন্য attention-grabbing হতে হবে।
   * Mobile screen-এ দেখলেও subject, composition এবং text যেন পরিষ্কার ও সহজে বোঝা যায়।
   * Professional editorial / premium social-media feature image-এর visual quality বজায় রাখুন।
   * Strong visual hierarchy এবং clean composition ব্যবহার করুন।

3. Aspect Ratio

   * 16:9 landscape
   * Image must be optimized for Blog feature image এবং social-media sharing.

4. Title & Subtitle

   * Blog Post-এর exact Title এবং exact Subtitle image-এর মধ্যে ব্যবহার করুন।
   * Title হবে প্রধান visual text এবং Subtitle হবে supporting text।
   * Text যেন পরিষ্কার, highly legible এবং mobile-friendly হয়।
   * Title বা Subtitle-এর wording পরিবর্তন, paraphrase বা shorten করবেন না।
   * Text placement এমনভাবে করুন যাতে background-এর গুরুত্বপূর্ণ visual elements ঢেকে না যায়।

5. Composition

   * Background scene এবং text-এর মধ্যে clear visual separation রাখুন।
   * গুরুত্বপূর্ণ character বা subject যেন crop না হয়।
   * Thumbnail size-এ দেখলেও composition যেন visually effective থাকে।
   * অতিরিক্ত decorative elements, unnecessary objects বা visual clutter এড়িয়ে চলুন।

6. Content Accuracy

   * Blog Post-এর context-এর বাইরে কোনও character, event, object বা visual concept যোগ করবেন না।
   * Blog Post-এর মূল message-এর সঙ্গে image-এর visual storytelling-এর সামঞ্জস্য থাকতে হবে।

7. Overall Style

   * Modern
   * Cinematic
   * Bright
   * Glossy
   * Premium
   * Editorial
   * Social-media friendly
   * Mobile-first readability

TEXT ACCURACY — MANDATORY

Image-এর মধ্যে Blog Post-এর Title এবং Subtitle exactly as provided ব্যবহার করতে হবে।

 কোনও spelling mistake, missing word, extra word, character substitution বা unintended text distortion গ্রহণযোগ্য নয়।

BLOG POST

[Insert Blog Post Here]`;

    function updatePrompt() {
      const inputVal = document.getElementById('in_blog').value.trim() || "[Insert Blog Post Here]";
      const finalPrompt = pTemplate.replace("[Insert Blog Post Here]", inputVal);
      document.getElementById('p_result').innerText = finalPrompt;
    }

    function clearAll() {
      document.getElementById('in_blog').value = "";
      updatePrompt();
    }

    function copyText() {
      const text = document.getElementById('p_result').innerText;
      const btn = document.getElementById('copyBtn');
      const btnSpan = btn.querySelector('span');

      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btnSpan.innerText = "Copied to Clipboard!";
        
        setTimeout(() => {
          btn.classList.remove('copied');
          btnSpan.innerText = "Copy Full Prompt";
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompt;
  </script>
</body>
</html>

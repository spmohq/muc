<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Titles and Sub-titles - Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px 20px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
    }

    /* Custom Scrollbar */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
      text-transform: uppercase;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Edit Titles and Sub-titles</h1>
      <p class="subtitle">Real-time Prompt Optimization Engine</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Configuration</span>
          <button class="clear-btn" onclick="clearAll()">Clear Input</button>
        </div>
        <div class="field-block">
          <label>Define [N] (Number of Parts)</label>
          <input type="text" id="in_n" class="dynamic-input" placeholder="Enter a number (e.g. 5)" oninput="updatePrompts()">
        </div>
      </div>

      <!-- Prompt #1 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #1</span></div>
        <div class="prompt-content" id="p1"></div>
        <button class="btn copy-btn" onclick="copyText('p1', this)"><span>Copy Prompt #1</span></button>
      </div>

      <!-- Prompt #2 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #2</span></div>
        <div class="prompt-content" id="p2"></div>
        <button class="btn copy-btn" onclick="copyText('p2', this)"><span>Copy Prompt #2</span></button>
      </div>

      <!-- Prompt #3 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #3</span></div>
        <div class="prompt-content" id="p3"></div>
        <button class="btn copy-btn" onclick="copyText('p3', this)"><span>Copy Prompt #3</span></button>
      </div>

      <!-- Prompt #4 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #4</span></div>
        <div class="prompt-content" id="p4"></div>
        <button class="btn copy-btn" onclick="copyText('p4', this)"><span>Copy Prompt #4</span></button>
      </div>

      <!-- Prompt #5 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #5</span></div>
        <div class="prompt-content" id="p5"></div>
        <button class="btn copy-btn" onclick="copyText('p5', this)"><span>Copy Prompt #5</span></button>
      </div>

      <!-- Prompt #6 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #6</span></div>
        <div class="prompt-content" id="p6"></div>
        <button class="btn copy-btn" onclick="copyText('p6', this)"><span>Copy Prompt #6</span></button>
      </div>

      <!-- Prompt #7 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #7</span></div>
        <div class="prompt-content" id="p7"></div>
        <button class="btn copy-btn" onclick="copyText('p7', this)"><span>Copy Prompt #7</span></button>
      </div>

      <!-- Prompt #8 -->
      <div class="step-card">
        <div class="step-header"><span class="step-label">Prompt #8</span></div>
        <div class="prompt-content" id="p8"></div>
        <button class="btn copy-btn" onclick="copyText('p8', this)"><span>Copy Prompt #8</span></button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = {
      p1: `এই ব্লগ পোস্টের মূল অংশ কয়টি?`,
      p2: `এই ব্লগ পোস্টের [N]টি মূল অংশের জন্য আরও সংক্ষিপ্ত, শক্তিশালী এবং পাঠকবান্ধব শিরোনামের একটি সেট লিখুন।`,
      p3: `এই [N]টি শিরোনাম থেকে ইংরেজি শব্দ বাদ দিয়ে আরও প্রাঞ্জল, সহজ, শক্তিশালী, স্মরণীয় এবং প্রকাশযোগ্য বাংলা সংস্করণ লিখুন।`,
      p4: `প্রথম সেটের শক্তিশালী শিরোনামগুলো সম্পাদনা করে একটি চূড়ান্ত, প্রকাশযোগ্য [N]টি শিরোনামের তালিকা দিন।`,
      p5: `এই [N]টি শিরোনামের জন্য এক লাইনের প্রাঞ্জল ও প্রকাশযোগ্য উপশিরোনাম লিখুন, যাতে প্রতিটি অংশের মূল বক্তব্য স্পষ্ট হয়।`,
      p6: `এই [N]টি শিরোনাম ও উপশিরোনাম সম্পাদনা করে ভাষা, ছন্দ এবং টোনে আরও একরকম একটি চূড়ান্ত প্রকাশযোগ্য সংস্করণ দিন।`,
      p7: `এই [N]টি শিরোনাম ও উপশিরোনামকে এমনভাবে সম্পাদনা করুন, যাতে প্রতিটি জোড়ার ভাষা, ছন্দ, দৈর্ঘ্য এবং টোন একরকম ও প্রকাশযোগ্য হয়।`,
      p8: `এই [N]টি উপশিরোনামকে প্রায় সমান দৈর্ঘ্যের, আরও ছন্দময় এবং প্রকাশযোগ্য করে সম্পাদনা করুন।`
    };

    function updatePrompts() {
      const nValue = document.getElementById('in_n').value.trim() || "[N]";
      
      for (let key in templates) {
        let content = templates[key].split("[N]").join(nValue);
        document.getElementById(key).innerText = content;
      }
    }

    function clearAll() {
      document.getElementById('in_n').value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerText = "Copied to Clipboard!";
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompts;
  </script>
</body>
</html>

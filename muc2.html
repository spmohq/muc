# CORE FRAMEWORK

Curiosity অবশ্যই genuine value gap-এর ওপর ভিত্তি করে তৈরি করবে।

# CONTENT CREATION RULES

## PART A — FACEBOOK POST

Facebook Post-এর মূল লক্ষ্য:

**Problem Awareness + Interest + Curiosity + Blog Visit**

### আদর্শ কাঠামো:

**1. Hook**

প্রথমেই এমন একটি statement, question, observation অথবা relatable situation ব্যবহার করবে যা target reader-এর attention ধরে।

Hook যেন সরাসরি reader-এর সমস্যা বা desired outcome-এর সঙ্গে সম্পর্কিত হয়।

---

**2. Problem / Experience**

পাঠক যে সমস্যার সম্মুখীন হচ্ছেন, সেটিকে সহজ ও relatable ভাষায় তুলে ধরবে।

প্রয়োজনে everyday experience, common mistake, misconception অথবা recognizable situation ব্যবহার করতে পারো।

---

**3. Problem-এর গুরুত্ব**

ব্যাখ্যা করবে কেন সমস্যাটি উপেক্ষা করা উচিত নয়।

সমস্যার consequence, hidden cost, frustration অথবা missed opportunity তুলে ধরতে পারো।

---

**4. Curiosity / Promise**

ইঙ্গিত দেবে যে সমস্যাটির সমাধানের একটি কার্যকর উপায় রয়েছে এবং Blog Post-এ সেই সমাধানটি বিস্তারিতভাবে ব্যাখ্যা করা হয়েছে।

Curiosity তৈরি করবে, কিন্তু clickbait করবে না।

---

**5. Blog Post CTA**

পাঠককে Blog Post পড়তে স্পষ্ট ও natural CTA দেবে।

CTA-এর উদ্দেশ্য হবে:

**“আরও বিস্তারিত solution জানতে Blog Post-এ যান।”**

CTA যেন content-এর স্বাভাবিক continuation হয়, আলাদা promotional interruption-এর মতো না লাগে।


### Facebook Post-এর ক্ষেত্রে মনে রাখবে:

- এটি Blog Post-এর summary নয়।
- এটি mini-blog নয়।
- এটি complete solution নয়।
- এটি শুধু promotional advertisement-ও নয়।
- এটি reader-এর problem-এর সঙ্গে connection তৈরি করবে।
- এটি genuine interest তৈরি করবে।
- এটি Blog Post-এর value সম্পর্কে একটি credible expectation তৈরি করবে।
- এর primary conversion হলো **Blog Post visit/click**।


# PART B — BLOG POST

Blog Post-এর মূল লক্ষ্য:

**Problem → Solution → Practical Action**

### আদর্শ কাঠামো:

**1. Title**

Title-এ পাঠকের সমস্যা, desired outcome অথবা solution-এর value পরিষ্কারভাবে প্রতিফলিত হবে।

---

**2. Introduction**

পাঠককে বিষয়টির context দেবে এবং কেন এই বিষয়টি গুরুত্বপূর্ণ তা establish করবে।

Introduction অপ্রয়োজনীয়ভাবে দীর্ঘ করবে না।

---

**3. Problem**

সমস্যাটি পরিষ্কারভাবে define করবে।

পাঠক যেন বুঝতে পারেন:

- সমস্যাটি কী
- কেন এটি হচ্ছে
- কীভাবে এটি প্রকাশ পায়
- কেন সাধারণভাবে মানুষ এখানে আটকে যায়

প্রয়োজন অনুযায়ী এগুলো ব্যবহার করবে; সবগুলো জোর করে যুক্ত করবে না।

---

**4. Step-by-Step Solution**

এটাই Blog Post-এর প্রধান delivery section।

সমাধানকে logical এবং actionable ধাপে ভাগ করবে।

প্রতিটি step এমনভাবে লিখবে যাতে পাঠক বাস্তবে সেটি অনুসরণ করতে পারেন।

প্রয়োজনে:

- process
- checklist
- examples
- instructions
- mistakes to avoid
- decision points
- practical tips

ব্যবহার করবে।

---

**5. Examples / Tips**

Solution-কে বাস্তব ও সহজবোধ্য করার জন্য প্রয়োজন অনুযায়ী example, scenario, use case অথবা practical tips দেবে।

Example শুধুমাত্র decoration হিসেবে ব্যবহার করবে না; example-এর শিক্ষামূলক value থাকতে হবে।

---

**6. Summary**

মূল learning এবং actionable points সংক্ষেপে পুনরায় reinforce করবে।

নতুন কোনো গুরুত্বপূর্ণ concept এখানে introduce করবে না।

**7. CTA**

Blog Post-এর শেষে পাঠককে পরবর্তী logical action-এর দিকে নিয়ে যাবে।

CTA-এর ধরন content-এর উদ্দেশ্যের ওপর নির্ভর করবে।

CTA হতে পারে:

- কোনো action নেওয়া
- কোনো resource ব্যবহার করা
- related content পড়া
- কোনো tool/process প্রয়োগ করা
- অথবা নির্ধারিত business objective অনুযায়ী অন্য কোনো relevant next step

CTA অবশ্যই Blog Post-এর actual value delivery-এর সঙ্গে সামঞ্জস্যপূর্ণ হবে।


# DEPTH RULE

Facebook Post হবে:

**Shallow-to-Medium Information Depth + High Relevance + Curiosity**

Blog Post হবে:

**High Information Depth + Practical Solution + Actionability**

অর্থাৎ:

**Facebook Post পাঠককে solution-এর দরজায় নিয়ে যাবে।**

**Blog Post পাঠককে দরজার ভিতরে নিয়ে গিয়ে solution ব্যবহার করতে শেখাবে।**


# VALUE CONTINUITY RULE

দুই স্তরের মধ্যে একটি clear value bridge থাকবে।

Facebook Post-এ যে problem introduce করা হবে, Blog Post-এ সেই একই problem-এর detailed treatment থাকতে হবে।

Facebook Post-এর promise and Blog Post-এর delivery-এর মধ্যে mismatch থাকবে না।

যে solution-এর promise Facebook Post-এ করা হয়েছে, Blog Post-এ সেটি যথেষ্ট depth ও clarity সহ deliver করতে হবে।


# CTA TRANSITION RULE

Facebook Post-এর CTA হবে:

**Facebook → Blog**

Blog Post-এর CTA হবে:

**Blog → Desired Next Action**

অর্থাৎ দুই স্তরের CTA-এর কাজ এক নয়।

Facebook Post-এর CTA পাঠককে Blog Post-এ নিয়ে যাবে।

Blog Post-এর CTA পাঠককে content consumption থেকে meaningful action-এর দিকে নিয়ে যাবে।


# QUALITY CONTROL RULES

Final output দেওয়ার আগে নিজের তৈরি content silently যাচাই করবে।

নিশ্চিত করবে যে:

1. Facebook Post এবং Blog Post একই core problem-এর ওপর ভিত্তি করে তৈরি হয়েছে।
2. Facebook Post Blog Post-এর duplicate নয়।
3. Facebook Post পুরো solution প্রকাশ করেনি।
4. Facebook Post genuine curiosity তৈরি করেছে।
5. Facebook Post-এর CTA Blog Post-এর দিকে নিয়ে যাচ্ছে।
6. Blog Post self-contained।
7. Blog Post প্রকৃত solution delivery করছে।
8. Blog Post action-oriented।
9. Blog Post solution-focused।
10. Blog Post-এর steps বাস্তবে অনুসরণযোগ্য।
11. Facebook Post-এর promise এবং Blog Post-এর delivery-এর মধ্যে সামঞ্জস্য আছে।
12. দুই স্তরের মধ্যে natural progression আছে।
13. অপ্রয়োজনীয় clickbait, exaggeration অথবা artificial curiosity ব্যবহার করা হয়নি।
14. পাঠককে শুধু information দেওয়া নয়, যথাসম্ভব meaningful action-এর দিকে এগিয়ে নেওয়া হয়েছে।

    function updatePrompt() {
      const inputVal = document.getElementById('in_context').value.trim() || "[এখানে বিষয় / সমস্যা / keyword / audience / desired outcome / অন্যান্য প্রয়োজনীয় context দেওয়া হবে]";
      const finalPrompt = pTemplate.replace("[INPUT_DATA]", inputVal);
      document.getElementById('p_result').innerText = finalPrompt;
    }

    function clearAll() {
      document.getElementById('in_context').value = "";
      updatePrompt();
    }

    function copyText() {
      const text = document.getElementById('p_result').innerText;
      const btn = document.getElementById('copyBtn');
      const btnSpan = btn.querySelector('span');

      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btnSpan.innerText = "Copied to Clipboard!";
        
        setTimeout(() => {
          btn.classList.remove('copied');
          btnSpan.innerText = "Copy Full Prompt";
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompt;
